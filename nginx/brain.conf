limit_req_zone $binary_remote_addr zone=vhod:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512M;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 0;
    }

    error_page 401 = @to_login;
    location @to_login { return 302 /login?next=$request_uri; }

    location = /login           { proxy_pass http://127.0.0.1:8090/login;
                                  proxy_set_header X-Real-IP $remote_addr; }
    location = /api/auth/login  { limit_req zone=vhod burst=5 nodelay;
                                  limit_req_status 429;
                                  proxy_pass http://127.0.0.1:8090/auth/login;
                                  proxy_set_header X-Real-IP $remote_addr; }
    location = /api/auth/logout { proxy_pass http://127.0.0.1:8090/auth/logout; }

    # данные «Здоровья» с iPhone: вход по ключу в заголовке, не по паролю сайта
    location = /api/health/ingest {
        limit_req zone=vhod burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64M;
        proxy_pass http://127.0.0.1:8095/ingest;
        proxy_read_timeout 120s;
    }

    location = / { return 302 /code/; }

    location = /me { return 302 /me/; }
    location /me/ {
        auth_request /_auth;
        alias /var/www/me/;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex";
    }

    location = /work { return 302 /work/; }
    location /work/ {
        auth_request /_auth;
        alias /var/www/work/;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex";
    }

    location /code/ {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding gzip;
        proxy_read_timeout 3600s;
    }
}
